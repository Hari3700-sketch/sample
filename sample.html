const z=n=>String(n).padStart(2,"0"),fm=d=>d.toISOString().replace(/[-:]|\.\d+/g,"");
$("#gc").href=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(C.groom+" weds "+C.bride)}&dates=${fm(C.date)}/${fm(new Date(+C.date+36e5*3))}&location=${encodeURIComponent(C.venue+", "+C.addr)}`;
$("#cal").onclick=()=>{const t=["BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT","DTSTART:"+fm(C.date),"DTEND:"+fm(new Date(+C.date+108e5)),"SUMMARY:"+C.groom+" weds "+C.bride,"LOCATION:"+C.venue+"\\, "+C.addr,"END:VEVENT","END:VCALENDAR"].join("\r\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/calendar"}));a.download="wedding.ics";document.body.appendChild(a);a.click();a.remove()};
function tick(){let s=Math.max(0,(C.date-Date.now())/1e3|0);$("#cd").innerHTML=[["Days",s/86400|0],["Hrs",s/3600%24|0],["Min",s/60%60|0],["Sec",s%60]].map(a=>`<div><b>${z(a[1])}</b><span>${a[0].toUpperCase()}</span></div>`).join("")}tick();setInterval(tick,1e3);
const io=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&(x.target.classList.add("in"),io.unobserve(x.target))),{threshold:.15});

// carousels (coverflow)
function car(c,d){const k=[...c.children];d.innerHTML=k.map(()=>"<i></i>").join("");let r;const u=()=>{const b=c.getBoundingClientRect(),m=b.left+b.width/2;let best=0,bd=1e9;k.forEach((e,i)=>{const r=e.getBoundingClientRect(),x=Math.abs(r.left+r.width/2-m),q=Math.min(x/b.width,1);e.style.transform=`scale(${1-q*.28})`;e.style.opacity=1-q*.6;if(x<bd){bd=x;best=i}});[...d.children].forEach((e,i)=>e.className=i==best?"a":"")};c.addEventListener("scroll",()=>{cancelAnimationFrame(r);r=requestAnimationFrame(u)},{passive:true});u()}
car($("#c1"),$("#d1"));car($("#c2"),$("#d2"));
// pull-to-reveal scroll
(()=>{const bot=$("#bot"),pap=$("#pap"),H=300;let p=0,drag=0,y0=0,p0=0;const set=v=>{p=Math.max(.02,Math.min(1,v));pap.style.transform=`scaleY(${p})`;bot.style.transform=`translateY(${(p-.02)*H}px)`;[...pap.children].forEach(c=>c.style.opacity=Math.max(0,(p-.3)/.5))};
const dn=e=>{drag=1;y0=e.clientY;p0=p;bot.setPointerCapture&&bot.setPointerCapture(e.pointerId)},mv=e=>{if(drag)set(p0+(e.clientY-y0)/H)},up=()=>{if(!drag)return;drag=0;const f=p>.4;const t=f?1:.02,s=p,t0=performance.now();(function a(n){const k=Math.min(1,(n-t0)/500);set(s+(t-s)*k);k<1&&requestAnimationFrame(a)})(t0);f&&petals(70)};
bot.addEventListener("pointerdown",dn);bot.addEventListener("pointermove",mv);bot.addEventListener("pointerup",up);bot.addEventListener("pointercancel",up);bot.style.touchAction="none";set(.02)})();
// petals
const cv=$("#cv"),cx=cv.getContext("2d");let P=[],W,Hh;const rs=()=>{W=cv.width=innerWidth;Hh=cv.height=innerHeight};rs();addEventListener("resize",rs);
const mk=(x,y,b)=>({x,y,s:6+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.05,vx:b?(Math.random()-.5)*9:(Math.random()-.5)*.5,vy:b?-Math.random()*8:.4+Math.random()*.7,w:Math.random()*6,bt:b?1:0,c:["#f4a7b9","#e87a95","#f9cfd8","#c9a45c"][Math.random()*4|0]});
for(let i=0;i<16;i++)P.push(mk(Math.random()*innerWidth,Math.random()*innerHeight));

(function f(){cx.clearRect(0,0,W,Hh);P=P.filter(p=>p.y<Hh+30&&p.x>-30&&p.x<W+30);P.forEach(p=>{p.w+=.02;p.x+=p.vx+Math.sin(p.w)*.5;p.y+=p.vy;p.r+=p.vr;if(p.bt){p.vy+=.15;p.vx*=.98;if(p.vy>1.5)p.bt=0}cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=.8;cx.beginPath();cx.ellipse(0,0,p.s,p.s*.6,0,0,7);cx.fill();cx.restore()});
while(P.length<16)P.push(mk(Math.random()*W,-20));requestAnimationFrame(f)})();
// music: synthesized soft Indian-pentatonic lullaby
let ac,mg,mo=0;const mu=$("#mu");
function music(){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.55;const dl=ac.createDelay(),fb=ac.createGain();dl.delayTime.value=.45;fb.gain.value=.4;dl.connect(fb);fb.connect(dl);mg.connect(ac.destination);mg.connect(dl);dl.connect(ac.destination);
[146.83,220,293.66].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(mg);o.start()});
const S=[293.66,329.63,369.99,440,493.88,587.33,659.25,739.99],M=[0,2,4,5,4,2,3,1,0,2,4,7,5,4,2,1,3,4,5,6,5,4,2,0,1,2,4,2,1,0,1,0],B=.6;let n=ac.currentTime+.1,i=0;
const note=(f,t,v)=>{[1,2].forEach((m,k)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=k?"triangle":"sine";o.frequency.value=f*m;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v/(k?3:1),t+.01);g.gain.exponentialRampToValueAtTime(.001,t+2);o.connect(g);g.connect(mg);o.start(t);o.stop(t+2.1)})};
setInterval(()=>{while(n<ac.currentTime+.8){const x=M[i%M.length];note(S[x],n,.16);if(i%8==0)note(S[0]/2,n,.2);i++;n+=B}},250)}

mu.onclick=tog;
